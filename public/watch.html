<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menonton... - Gio-desu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="watch-page">
    <header>
        <div class="watch-header">
            <a href="/" class="back-btn">← Beranda</a>
            <h1>🎬 Gio-desu</h1>
        </div>
    </header>

    <main>
        <div id="skeleton-watch" class="watch-layout">
            <div class="player-wrap"><div class="skel-thumb"></div></div>
            <aside class="related-panel">
                <div class="skel-line"></div>
                <div class="skel-line"></div>
                <div class="skel-line short"></div>
            </aside>
        </div>

        <div id="watch-content" class="watch-layout hidden"></div>

        <div id="error-box" class="empty hidden"></div>
    </main>

    <script src="watch.js"></script>
</body>
</html>
